version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: car_rental_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5   

  pgadmin:
    image: dpage/pgadmin4:8.0
    container_name: car_rental_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - app-network
      - internal-network
    depends_on:
      db :
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_rental_web
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "True"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
    ports:
      - "8000:8000"
    volumes:
      - static_data:/app/static
      - media_data:/app/media
    networks:
      - app-network
      - internal-network
    dns:
      - 8.8.8.8
      - 8.8.4.4



volumes:
  postgres_data:
  static_data:
  media_data:
  pgadmin_data:

networks:
  app-network:
    driver: bridge
  internal-network:
    driver: bridge
    internal: true